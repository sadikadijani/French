    <div class="row between tiny muted"><span>${esc(frDate(days[0].d,{day:'numeric',month:'short'}))}</span><span>today</span></div>
    <div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><div class="v num">${streak()}</div><div class="k">Day streak</div></div><div class="stat"><div class="v num">${all.length?Math.round(accuracy(all.slice(-100))*100)+'%':'—'}</div><div class="k">Accuracy (last 100)</div></div></div></div>
  </div>
  <div class="stats"><div class="stat"><div class="v num">${learnedCount()}</div><div class="k">Words learned</div></div><div class="stat"><div class="v num">${Object.keys(ST.textsRead).length}</div><div class="k">Texts read</div></div><div class="stat"><div class="v num">${ST.journal.length}</div><div class="k">Journal entries</div></div><div class="stat"><div class="v num">${all.length}</div><div class="k">Answers</div></div></div>
  <div class="grid2">
   <div class="card stack"><h3>Grammar</h3><div class="stack" style="gap:8px">${UNITS.map(u=>{const m=unitMastery(u);return `<div><div class="row between small"><span>${esc(u.title)}</span><span class="num muted">${m?m+'%':'—'}</span></div><div class="progress"><i style="width:${m}%;${m>=80?'background:var(--ok)':''}"></i></div></div>`;}).join('')}</div></div>
   <div class="card stack"><h3>Level history</h3><div class="list">${[...ST.levelLog].reverse().slice(0,12).map(l=>`<div class="li"><span class="pill lv">${esc(l.level)}</span><span class="grow small">${l.why==='up'?'Moved up':l.why==='down'?'Moved down':l.why==='start'?'Start':'Changed by you'}</span><span class="tiny muted">${esc(frDate(l.t,{day:'numeric',month:'short',year:'numeric'}))}</span></div>`).join('')}</div>
    <p class="small muted">${Sync.ready?'Progress is saved to your Claude account and follows you across devices.':'Progress is saved in this browser.'}</p></div>
  </div></div>`;
  $$('#pm button').forEach(b=>b.onclick=()=>{ST.mode=b.dataset.m;if(ST.mode==='adaptive')ST.levelSince=Date.now();save();paintChrome();viewProgres(v);});
  $$('#pl button').forEach(b=>b.onclick=()=>{setLevel(b.dataset.l,'manual');viewProgres(v);});
}

/* ================= SETTINGS ================= */
function openSettings(focus){
  const voices=TTS.voices;
  openModal(`<div class="stack">
   <div class="row between"><h2>Réglages</h2><button class="btn ghost sm" data-close type="button">Done</button></div>
   <div><label class="lbl" for="s-name">Your name</label><input type="text" id="s-name" value="${esc(ST.name)}" data-noaccent="1"></div>
   <div><label class="lbl" for="s-voice">French voice</label>${voices.length?`<div class="row" style="flex-wrap:nowrap"><select id="s-voice"><option value="">Automatic</option>${voices.map(x=>`<option ${x.name===ST.voice?'selected':''} value="${esc(x.name)}">${esc(x.name)} (${esc(x.lang)})</option>`).join('')}</select><button class="btn" id="s-test" type="button">Test</button></div><p class="tiny muted" style="margin-top:4px">Voices come from your device. On iPhone and Mac, better French voices can be downloaded in the system's speech settings.</p>`:`<div class="note">${TTS.ok?'No French voice found on this device yet. Your system may still read French with its default voice.':'Read-aloud is not available in this browser.'}</div>`}</div>
   <div><label class="lbl" for="s-rate">Reading speed: <span id="s-rv">${ST.rate}</span></label><input type="range" id="s-rate" min="0.5" max="1.3" step="0.05" value="${ST.rate}" style="width:100%"></div>
   <label class="row small" style="gap:8px"><input type="checkbox" id="s-acc" ${ST.strictAccents?'checked':''}> Count missing accents as mistakes</label>
   <hr class="sep">
   <div class="stack" id="s-ai" style="gap:10px"><b>AI connection</b>${IN_CLAUDE?`<p class="small muted">Inside Claude, the AI features use your Claude account. In the GitHub version of the app you can connect a free Google Gemini or Mistral key instead.</p>`:`
    <p class="small muted">The AI features (translation, corrections, conversations, stories, exercises) use a free key from Google Gemini or Mistral. The key stays only in this browser on this device.</p>
    <div><label class="lbl">Use</label><div class="seg" id="s-prov">${[['auto','Automatic'],['gemini','Gemini'],['mistral','Mistral']].map(([k,l])=>`<button type="button" data-p="${k}" aria-pressed="${aiPref()===k}">${l}</button>`).join('')}</div></div>
    ${Object.entries(PROVIDERS).map(([k,pv])=>`<div class="card flat stack" style="gap:8px;padding:14px"><div class="row between"><b>${pv.name}</b><span class="pill ${aiKey(k)?'ok':''}" id="s-st-${k}">${aiKey(k)?'Key saved':'No key'}</span></div>
      <div class="row" style="flex-wrap:nowrap;gap:6px"><input type="password" id="s-key-${k}" value="${esc(aiKey(k))}" placeholder="Paste your ${pv.name} API key" autocomplete="off" data-noaccent="1"><button class="btn sm" type="button" data-test="${k}">Test</button></div>
      <details><summary class="small muted" style="cursor:pointer">How to get a free key · model</summary><div class="small muted stack" style="gap:6px;margin-top:6px">
       ${k==='gemini'?`<ol style="margin:0;padding-left:18px"><li>Open <a href="${pv.keyUrl}" target="_blank" rel="noopener">aistudio.google.com/apikey</a> and sign in with a Google account.</li><li>Tap <b>Create API key</b>, then copy it.</li><li>Paste it above and tap <b>Test</b>.</li></ol><p>Free tier with daily limits. Google may use free-tier requests to improve its products, so don't paste private information.</p>`
       :`<ol style="margin:0;padding-left:18px"><li>Open <a href="${pv.keyUrl}" target="_blank" rel="noopener">console.mistral.ai/api-keys</a> and create an account.</li><li>Choose the free <b>Experiment</b> plan (it may ask to verify your phone number).</li><li>Create a key, copy it, paste it above and tap <b>Test</b>.</li></ol><p>Free plan with rate limits. Mistral may use free-plan requests to train its models, so don't paste private information.</p>`}
       <label class="lbl" for="s-model-${k}" style="margin-top:4px">Model (leave empty for ${pv.model})</label><input type="text" id="s-model-${k}" value="${esc(localStorage.getItem('cahier.ai.model.'+k)||'')}" placeholder="${pv.model}" data-noaccent="1"></div></details>
      <div class="small" id="s-res-${k}"></div></div>`).join('')}
    <p class="tiny muted">Now using: <b id="s-now">${AI.prov?AI.name():'nothing yet'}</b></p>`}
   </div>
   <hr class="sep">
   <div class="stack" style="gap:6px"><b>Start over</b><p class="small muted">Deletes your progress, words, journal and mistakes. Your saved texts are kept.</p><div><button class="btn danger" id="s-reset" type="button">Reset progress</button></div></div>
  </div>`,(sheet)=>{
    $('#s-name',sheet).oninput=e=>{ST.name=e.target.value.trim()||'toi';save();};
    const sv=$('#s-voice',sheet);if(sv)sv.onchange=e=>{ST.voice=e.target.value;save();};
    const st=$('#s-test',sheet);if(st)st.onclick=()=>TTS.speak("Bonjour ! Aujourd'hui, j'ai pris le tram et je suis allé au bureau.");
    $('#s-rate',sheet).oninput=e=>{ST.rate=+e.target.value;$('#s-rv',sheet).textContent=ST.rate;save();};
    $('#s-acc',sheet).onchange=e=>{ST.strictAccents=e.target.checked;save();};
    if(!IN_CLAUDE){
      const now=()=>{AI.refresh();$('#s-now',sheet).textContent=AI.prov?AI.name():'nothing yet';};
      $$('#s-prov button',sheet).forEach(b=>b.onclick=()=>{aiSet('cahier.ai.pref',b.dataset.p==='auto'?'':b.dataset.p);$$('#s-prov button',sheet).forEach(x=>x.setAttribute('aria-pressed',x===b));now();});
      Object.keys(PROVIDERS).forEach(k=>{
        const inp=$('#s-key-'+k,sheet);
        inp.oninput=()=>{aiSet('cahier.ai.key.'+k,inp.value.trim());const st=$('#s-st-'+k,sheet);st.textContent=inp.value.trim()?'Key saved':'No key';st.className='pill '+(inp.value.trim()?'ok':'');now();};
        $('#s-model-'+k,sheet).oninput=e=>aiSet('cahier.ai.model.'+k,e.target.value.trim());
      });
      $$('[data-test]',sheet).forEach(b=>b.onclick=async()=>{
        const k=b.dataset.test,out=$('#s-res-'+k,sheet);
        if(!aiKey(k)){out.innerHTML='<span style="color:var(--warn)">Paste a key first.</span>';return;}
        out.innerHTML='<span class="spinner"></span> Testing…';
        try{const t=await extCall(k,[{role:'user',content:'Réponds seulement : « Ça marche ! »'}],{});out.innerHTML=`<span style="color:var(--ok)">✓ Connected. It said: ${esc(t.trim().slice(0,60))}</span>`;}
        catch(e){const prev=AI.prov;AI.prov=k;out.innerHTML=`<span style="color:var(--red)">${esc(aiMsg(e))}${e.code==='network'?' If your connection works, this service may be blocking requests from the browser: try the other one.':''}</span>`;AI.prov=prev;}
      });
      if(focus==='ai')setTimeout(()=>$('#s-ai',sheet).scrollIntoView({block:'start'}),50);
    }
    const r=$('#s-reset',sheet);r.onclick=()=>{if(!r.dataset.sure){r.dataset.sure=1;r.textContent='Tap again to confirm';return;}const keep={name:ST.name,voice:ST.voice,rate:ST.rate};ST=migrate({...defaultState(),...keep,updatedAt:Date.now()});save();modalClose&&modalClose();go('today');toast('Progress reset.');};
  });
}

/* ================= BOOT ================= */
const VIEWS={exos:viewExos,notebook:viewNotebook,today:viewToday,journee:viewJournee,textes:viewTextes,parler:viewParler,mots:viewMots,grammaire:viewGrammaire,carnet:viewCarnet,progres:viewProgres};
(function boot(){
  const h=(location.hash||'').replace('#','');
  if(ROUTES.some(r=>r.id===h)) route=h;
  TTS.init();
  render();
  AI.init();
  Sync.init();
})();

/* ================= MES MOTS (notebook view) ================= */
function viewNotebook(v){
  if(params.session) return paintSession(v);
  const all=notebookWords();
  const f=params.f||'all',q=normAns(params.q||'');
  const state=w=>{const c=ST.srs[w.id];if(!c)return 'new';if(c.reps>=2&&c.iv>=7)return 'known';return 'learning';};
  let list=all.filter(w=>f==='all'||(f==='missing'?!w.en:f==='expr'?/\s/.test(w.fr.trim()):state(w)===f));
  if(q) list=list.filter(w=>normAns(w.fr).includes(q)||normAns(w.en||'').includes(q));
  const n=Date.now();const dueN=all.filter(w=>!ST.srs[w.id]||ST.srs[w.id].due<=n).length;
  const pill={new:'<span class="pill">New</span>',learning:'<span class="pill warn">Learning</span>',known:'<span class="pill ok">Known</span>'};
  v.innerHTML=`<div class="stack-lg">
  <div class="stack" style="gap:6px"><div class="eyebrow">Your vocabulary notebook</div><h1>Mes mots</h1>
   <p class="muted">Save any word or phrase: tap a word in a text and choose <b>+ Notebook</b>, or select a few words and tap <b>+ Notebook</b>. Paste the meaning from Apple Translate, or let the app fill it in.</p></div>
  <div class="row">
   <button class="btn primary" id="nb-prac" type="button" ${all.length?'':'disabled'}>Practise ${dueN?`(${dueN} due)`:'all'}</button>
   <button class="btn" id="nb-add" type="button">+ Add word or expression</button>
   <button class="btn" id="nb-copy" type="button" ${all.length?'':'disabled'}>Copy list</button>
  </div>
  <div class="row between" style="gap:10px">
   <div class="seg" id="nb-f">${[['all','All'],['expr','Expressions'],['missing','Needs translation'],['new','New'],['learning','Learning'],['known','Known']].map(([k,l])=>`<button type="button" data-f="${k}" aria-pressed="${k===f}">${l}${k==='missing'?` (${all.filter(w=>!w.en).length})`:''}</button>`).join('')}</div>
   <input type="search" id="nb-q" placeholder="Search…" value="${esc(params.q||'')}" style="max-width:220px" data-noaccent="1">
  </div>
  ${list.length?`<div class="list">${list.map(w=>`<div class="li nbrow" style="align-items:flex-start">${spk(w.fr)}
    <div class="grow stack" style="gap:2px"><div class="fr translatable">${esc(w.fr)}</div>
     <div class="small en ${w.en?'':'missing'}">${w.en?esc(w.en):'No translation yet'}</div>
     ${w.ex?`<div class="small muted translatable" style="font-family:var(--f-read);font-style:italic">${esc(w.ex)}</div>`:''}
     ${w.note?`<div class="tiny muted">${esc(w.note)}</div>`:''}
     <div class="tiny muted">${w.src?esc(w.src)+' · ':''}${w.added?esc(frDate(w.added,{day:'numeric',month:'short'})):''}</div></div>
    <span class="stack" style="gap:6px;align-items:flex-end">${pill[state(w)]}<span class="row" style="gap:4px">${w.custom?`<button class="btn sm" type="button" data-edit="${w.id}">${w.en?'Edit':'Add meaning'}</button>`:''}<button class="iconbtn" type="button" data-rm="${w.id}" aria-label="Remove">✕</button></span></span></div>`).join('')}</div>`
  :`<div class="empty">${all.length?'No words match.':'Your notebook is empty. Open a text, tap a word and choose + Notebook.'}</div>`}
  </div>`;
  $$('#nb-f button').forEach(b=>b.onclick=()=>go('notebook',{f:b.dataset.f,q:params.q}));
  let tmr;$('#nb-q').oninput=e=>{clearTimeout(tmr);const val=e.target.value;tmr=setTimeout(()=>{params.q=val;viewNotebook(v);const i=$('#nb-q');i.focus();i.setSelectionRange(val.length,val.length);},250);};
  $('#nb-add').onclick=()=>openAddWord({src:'Mes mots'});
  $$('[data-edit]',v).forEach(b=>b.onclick=()=>openAddWord({id:b.dataset.edit}));
  $$('[data-rm]',v).forEach(b=>b.onclick=()=>{
    if(!b.dataset.sure){b.dataset.sure=1;b.textContent='?';b.title='Tap again to remove';return;}
    const id=b.dataset.rm;ST.customVocab=ST.customVocab.filter(w=>w.id!==id);ST.nbRefs=(ST.nbRefs||[]).filter(x=>x!==id);if(id.startsWith('c'))delete ST.srs[id];save();paintChrome();viewNotebook(v);});
  $('#nb-copy').onclick=()=>copyText(all.map(w=>`${w.fr} — ${w.en||'?'}${w.ex?`  (${w.ex})`:''}`).join('\n'));
  $('#nb-prac').onclick=()=>{
    const now=Date.now();
    let qids=[...all.filter(w=>ST.srs[w.id]&&ST.srs[w.id].due<=now),...all.filter(w=>!ST.srs[w.id])].map(w=>w.id);
    if(!qids.length) qids=shuffle(all).slice(0,30).map(w=>w.id);
    SESS.q=qids.slice(0,60);SESS.i=0;SESS.flipped=false;SESS.done=0;SESS.back='notebook';go('notebook',{session:1});
  };
}
