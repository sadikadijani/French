<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cahier">
<meta name="theme-color" content="#2344B5">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cahier de Français</title>
<meta name="description" content="Daily French practice: texts, Ma journée, vocabulary, grammar, speaking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Caveat:wght@500;700&display=swap">
<style>
:root{
  --paper:#F7F7FC; --surface:#FFFFFF; --surface-2:#EFEEF8; --surface-3:#E4E2F3;
  --ink:#191E3A; --ink-2:#4B5274; --ink-3:#7A809F;
  --blue:#2344B5; --blue-soft:#DDE3FA; --on-blue:#FFFFFF;
  --seyes:#D9D5EF; --seyes-strong:#BDB6E3;
  --red:#D23F57; --red-soft:#FBE3E7;
  --ok:#1B8756; --ok-soft:#DDF3E8; --warn:#A86A12; --warn-soft:#FBEFD9;
  --line:#DEDCEC; --shadow:0 1px 2px rgba(25,30,58,.06),0 6px 20px rgba(25,30,58,.06);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Literata",Georgia,serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#11132A; --surface:#191C37; --surface-2:#222647; --surface-3:#2C3159;
    --ink:#E9EAF6; --ink-2:#AEB2D0; --ink-3:#7F84A6;
    --blue:#8EA5FF; --blue-soft:#27305F; --on-blue:#0E1330;
    --seyes:#262A4E; --seyes-strong:#353A6B;
    --red:#FF7B8E; --red-soft:#43202C;
    --ok:#52D39B; --ok-soft:#173A2E; --warn:#F2B75B; --warn-soft:#3B2E17;
    --line:#2B2F55; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#11132A; --surface:#191C37; --surface-2:#222647; --surface-3:#2C3159;
  --ink:#E9EAF6; --ink-2:#AEB2D0; --ink-3:#7F84A6;
  --blue:#8EA5FF; --blue-soft:#27305F; --on-blue:#0E1330;
  --seyes:#262A4E; --seyes-strong:#353A6B;
  --red:#FF7B8E; --red-soft:#43202C;
  --ok:#52D39B; --ok-soft:#173A2E; --warn:#F2B75B; --warn-soft:#3B2E17;
  --line:#2B2F55; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.005em}
h1{font-size:1.9rem;line-height:1.15}
h2{font-size:1.35rem;line-height:1.2}
h3{font-size:1.08rem;line-height:1.25}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}
.tiny{font-size:.76rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--blue);color:var(--on-blue);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;position:relative;overflow:hidden}
.brand-mark::after{content:"";position:absolute;left:7px;top:0;bottom:0;width:1.5px;background:var(--red)}
.brand-name{font-family:var(--f-display);font-size:1.12rem;line-height:1.1}
.brand-sub{font-size:.72rem;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 10px;border-radius:8px;text-align:left;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--blue-soft);color:var(--blue);font-weight:600}
.nav svg,.tabbar svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 6px}
main{min-width:0;display:flex;flex-direction:column}
.top{display:none}
#view{width:100%;max-width:980px;margin:0 auto;padding-inline:28px;padding-block:28px 60px}
.tabbar{display:none}

.levelchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;font-weight:600;font-size:.86rem}
.levelchip b{background:var(--blue);color:var(--on-blue);border-radius:999px;padding:1px 8px;font-size:.8rem}
.levelchip span{color:var(--ink-2);font-weight:500}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  #view{padding-inline:16px;padding-block:18px 110px}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;color:var(--ink-3);padding:4px 0;font-weight:600}
  .tabbar button[aria-current="page"]{color:var(--blue)}
  h1{font-size:1.55rem}
}

/* ---------- common ---------- */
.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:26px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{box-shadow:none}
.card.raised{box-shadow:var(--shadow)}
.panel{background:var(--surface-2);border-radius:var(--r);padding:14px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:.9rem;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--seyes-strong);background:var(--surface-2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.iconbtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0;flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.speaking{background:var(--blue);color:var(--on-blue);border-color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.lv{background:var(--blue-soft);color:var(--blue)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.red{background:var(--red-soft);color:var(--red)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;padding:6px 12px;font-weight:600;font-size:.84rem;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
input[type=text],input[type=search],input[type=password],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;outline:none}
input[type=text]:focus,input[type=password]:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
textarea{resize:vertical;min-height:120px;line-height:1.6}
label.lbl{display:block;font-size:.8rem;font-weight:600;color:var(--ink-2);margin-bottom:5px}
hr.sep{border:0;border-top:1px solid var(--line);margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.empty{padding:26px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:var(--r)}
.note{font-size:.84rem;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:9px 12px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.progress{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--seyes-strong);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.thinking{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:.9rem;padding:10px 0}

/* ---------- Seyès notebook paper ---------- */
.seyes{
  --lh:32px;
  background-color:var(--surface);
  background-image:
    linear-gradient(90deg,transparent 46px,var(--red) 46px,var(--red) 47.5px,transparent 47.5px),
    repeating-linear-gradient(180deg,transparent 0 calc(var(--lh) - 1px),var(--seyes-strong) calc(var(--lh) - 1px) var(--lh)),
    repeating-linear-gradient(180deg,transparent 0 7px,var(--seyes) 7px 8px);
  background-position:0 0,0 12px,0 12px;
  border:1px solid var(--line);border-radius:var(--r);
  padding:12px 18px 20px 62px;
}
@media (max-width:560px){.seyes{padding-left:40px;background-image:linear-gradient(90deg,transparent 28px,var(--red) 28px,var(--red) 29.5px,transparent 29.5px),repeating-linear-gradient(180deg,transparent 0 calc(var(--lh) - 1px),var(--seyes-strong) calc(var(--lh) - 1px) var(--lh)),repeating-linear-gradient(180deg,transparent 0 7px,var(--seyes) 7px 8px)}}
.reader{font-family:var(--f-read);font-size:1.13rem;line-height:32px}
.sent{position:relative;display:block;padding:0 0 0 0;border-radius:4px;transition:background .2s}
.sent + .sent{margin-top:0}
.sent.active{background:color-mix(in srgb,var(--blue-soft) 80%,transparent)}
.sent .play{position:absolute;left:-36px;top:3px;width:26px;height:26px;border-radius:50%;border:0;background:none;color:var(--ink-3);display:grid;place-items:center;padding:0}
.sent .play:hover{color:var(--blue);background:var(--surface-2)}
.sent .play svg{width:14px;height:14px;fill:currentColor}
@media (max-width:560px){.sent .play{left:-34px}}
.w{cursor:pointer;border-radius:3px}
.w:hover{background:var(--blue-soft);color:var(--blue)}
.w.saved{text-decoration:underline;text-decoration-color:var(--blue);text-decoration-thickness:2px;text-underline-offset:4px}
.tr{display:block;font-family:var(--f-ui);font-size:.9rem;color:var(--ink-3);line-height:32px;font-style:italic}
.hand{font-family:var(--f-hand);color:var(--red);font-size:1.25em;line-height:1}

/* ---------- popover / modal / toast ---------- */
#pop{position:fixed;z-index:60;width:min(320px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px}
#pop .pw{font-family:var(--f-read);font-size:1.25rem}
#selbar{position:fixed;z-index:55;display:flex;gap:1px;background:var(--ink);border-radius:9px;overflow:hidden;box-shadow:var(--shadow)}
#selbar button{background:var(--ink);color:var(--paper);border:0;padding:8px 13px;font-weight:600;font-size:.84rem}
#selbar button:hover{background:color-mix(in srgb,var(--ink) 85%,var(--paper))}
#selbar button + button{border-left:1px solid color-mix(in srgb,var(--paper) 25%,transparent)}
.nbrow .en.missing{color:var(--warn);font-style:italic}
#modal{position:fixed;inset:0;z-index:70;background:rgba(10,12,30,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:640px){#modal{align-items:center}}
.sheet{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:calc(100% - 20px);overflow:auto;padding:22px;box-shadow:var(--shadow)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
@media (min-width:861px){#toast{bottom:28px}}
.toast{background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 16px;font-weight:500;font-size:.9rem;box-shadow:var(--shadow);animation:tin .25s ease}
.toast.good{background:var(--ok);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#accentbar{position:fixed;left:0;right:0;bottom:0;z-index:65;display:flex;gap:4px;justify-content:center;flex-wrap:wrap;background:var(--surface-2);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
#accentbar button{min-width:34px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-read);font-size:1.05rem}

/* ---------- today ---------- */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hello .date{font-family:var(--f-hand);font-size:1.5rem;color:var(--red);line-height:1}
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.task{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;width:100%}
.task:hover{border-color:var(--seyes-strong)}
.task .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--seyes-strong);flex:none;display:grid;place-items:center;margin-top:1px}
.task.done .chk{background:var(--ok);border-color:var(--ok)}
.task.done .chk::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task.done h3{color:var(--ink-2)}
.task .meta{font-size:.8rem;color:var(--ink-3)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--f-display);font-size:1.6rem;line-height:1.1}
.stat .k{font-size:.76rem;color:var(--ink-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.heat{display:grid;grid-template-columns:repeat(30,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--surface-3);max-width:100%}
.heat i.l1{background:color-mix(in srgb,var(--blue) 30%,var(--surface-3))}
.heat i.l2{background:color-mix(in srgb,var(--blue) 60%,var(--surface-3))}
.heat i.l3{background:var(--blue)}

/* ---------- lists ---------- */
.textcard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;width:100%;position:relative}
.textcard:hover{border-color:var(--seyes-strong);box-shadow:var(--shadow)}
.textcard .ex{font-family:var(--f-read);font-size:.92rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.textcard .read{position:absolute;top:12px;right:12px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .fr{font-family:var(--f-read);font-weight:500}
.li .grow{flex:1;min-width:0}

/* ---------- drills ---------- */
.drill{display:flex;flex-direction:column;gap:12px}
.prompt-big{font-family:var(--f-read);font-size:1.3rem;line-height:1.45}
.blank{display:inline-block;min-width:90px;border-bottom:2px solid var(--blue);margin:0 4px}
.feedback{border-radius:8px;padding:10px 14px;font-size:.92rem}
.feedback.good{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--red-soft);color:var(--red)}
.feedback.close{background:var(--warn-soft);color:var(--warn)}
.feedback .ans{font-family:var(--f-read);font-weight:500;color:var(--ink)}
.choices{display:grid;gap:8px}
.choice{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 14px;font-family:var(--f-read);font-size:1.02rem}
.choice:hover:not(:disabled){border-color:var(--blue)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--red);background:var(--red-soft)}
.choice:disabled{cursor:default}

/* ---------- flashcard ---------- */
.flash{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px 20px}
.flash .big{font-family:var(--f-read);font-size:2rem;line-height:1.2}
.flash .exs{font-family:var(--f-read);font-style:italic;color:var(--ink-2)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.rate button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 4px}
.rate small{font-weight:500;color:var(--ink-3);font-size:.72rem}

/* ---------- ladder ---------- */
.ladder{display:flex;flex-direction:column;gap:8px}
.rung{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;width:100%}
.rung:hover{border-color:var(--seyes-strong)}
.rung.next{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.rung .step{font-family:var(--f-display);font-size:1.3rem;color:var(--ink-3);width:30px;text-align:center}
.rung .mast{width:90px}
.rule{font-family:var(--f-ui)}
.rule p{margin:0 0 10px}
.rule table{border-collapse:collapse;font-size:.92rem;margin:4px 0 12px}
.rule td,.rule th{border-bottom:1px solid var(--line);padding:5px 12px 5px 0;text-align:left}
.rule th{font-size:.76rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.rule .ex{font-family:var(--f-read);display:flex;gap:8px;align-items:baseline;margin:4px 0}
.rule .ex em{color:var(--ink-3);font-family:var(--f-ui);font-size:.86rem}
.rule ul{margin:0 0 10px;padding-left:20px}
.tablewrap{overflow-x:auto}
.conjtable{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.conjtable .card{padding:12px 14px}
.conjtable ol{list-style:none;margin:6px 0 0;padding:0;font-family:var(--f-read);font-size:.95rem;line-height:1.7}
.conjtable ol b{font-weight:500;color:var(--blue)}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:10px;min-height:240px}
.bubble{max-width:86%;padding:10px 14px;border-radius:14px;font-family:var(--f-read);line-height:1.55}
.bubble.me{align-self:flex-end;background:var(--blue);color:var(--on-blue);border-bottom-right-radius:4px}
.bubble.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.fix{align-self:flex-end;max-width:86%;font-size:.84rem;color:var(--red);background:var(--red-soft);border-radius:8px;padding:6px 10px}
.fix.okay{color:var(--ok);background:var(--ok-soft)}

/* ---------- timer ---------- */
.timer{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;margin:0 auto;background:conic-gradient(var(--blue) var(--p,0%),var(--surface-3) 0)}
.timer > div{width:146px;height:146px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:2.6rem}

.corr{font-family:var(--f-read);font-size:1.05rem;line-height:32px}
.corr del{color:var(--red);text-decoration-thickness:1.5px}
.corr ins{text-decoration:none;font-family:var(--f-hand);color:var(--red);font-size:1.35em;padding:0 2px}
.err{display:grid;grid-template-columns:1fr;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.err:first-child{border-top:0}
.err .pair{font-family:var(--f-read)}
.err .pair s{color:var(--red)}
.err .pair b{color:var(--ok);font-weight:500}
input.blank-in{display:inline-block;width:10ch;max-width:60%;min-width:0;margin:0 3px;padding:0 4px;border:0;border-bottom:2px solid var(--blue);border-radius:0;background:color-mix(in srgb,var(--blue-soft) 45%,transparent);font-family:var(--f-read);font-size:1em;line-height:1.4;color:var(--blue);vertical-align:baseline;box-shadow:none}
input.blank-in:focus{box-shadow:none;background:var(--blue-soft);border-color:var(--blue)}
input.blank-in.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
input.blank-in.bad{border-color:var(--red);color:var(--red);background:var(--red-soft);text-decoration:line-through}
input.blank-in.close{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
input.blank-in::placeholder{color:var(--ink-3);font-style:italic}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

{id:'b-lenteur',level:'C1',title:'Éloge de la lenteur',focus:'Registre soutenu',

const UNITS = [
{id:'pres-reg',level:'A1',title:'Présent — verbes réguliers',sub:'-er, -ir, -re',conj:{tenses:['present'],verbs:'REG'},
 rule:`<p>Most verbs are regular. Remove the ending (<b>-er</b>, <b>-ir</b>, <b>-re</b>) and add:</p>
<div class="tablewrap"><table><tr><th></th><th>parler</th><th>finir</th><th>attendre</th></tr>
<tr><td>je</td><td>parl<b>e</b></td><td>fin<b>is</b></td><td>attend<b>s</b></td></tr>
<tr><td>tu</td><td>parl<b>es</b></td><td>fin<b>is</b></td><td>attend<b>s</b></td></tr>
<tr><td>il/elle/on</td><td>parl<b>e</b></td><td>fin<b>it</b></td><td>attend</td></tr>
<tr><td>nous</td><td>parl<b>ons</b></td><td>fin<b>issons</b></td><td>attend<b>ons</b></td></tr>
<tr><td>vous</td><td>parl<b>ez</b></td><td>fin<b>issez</b></td><td>attend<b>ez</b></td></tr>
<tr><td>ils/elles</td><td>parl<b>ent</b></td><td>fin<b>issent</b></td><td>attend<b>ent</b></td></tr></table></div>
<p>Spelling: <b>manger → nous mangeons</b>, <b>commencer → nous commençons</b> (to keep the soft sound).</p>
<p>The -e, -es, -ent endings are silent: <i>je parle, tu parles, ils parlent</i> sound the same.</p>`,
 ex:[['Je travaille à Luxembourg.','I work in Luxembourg.'],['Nous finissons à six heures.','We finish at six.'],['Ils attendent le bus.','They are waiting for the bus.']],mc:[]},

{id:'pres-irr',level:'A1',title:'Présent — les irréguliers essentiels',sub:'être, avoir, aller, faire…',conj:{tenses:['present'],verbs:'IRR_CORE'},
 rule:`<p>The 15 verbs below cover most of everyday speech. Learn them as sounds first.</p>
<div class="tablewrap"><table><tr><th></th><th>être</th><th>avoir</th><th>aller</th><th>faire</th></tr>
<tr><td>je</td><td>suis</td><td>ai</td><td>vais</td><td>fais</td></tr>
<tr><td>tu</td><td>es</td><td>as</td><td>vas</td><td>fais</td></tr>
<tr><td>il/elle</td><td>est</td><td>a</td><td>va</td><td>fait</td></tr>
<tr><td>nous</td><td>sommes</td><td>avons</td><td>allons</td><td>faisons</td></tr>
<tr><td>vous</td><td>êtes</td><td>avez</td><td>allez</td><td>faites</td></tr>
<tr><td>ils/elles</td><td>sont</td><td>ont</td><td>vont</td><td>font</td></tr></table></div>
<p>Also essential: <b>pouvoir</b> (je peux), <b>vouloir</b> (je veux), <b>devoir</b> (je dois), <b>savoir</b> (je sais), <b>venir</b> (je viens), <b>prendre</b> (je prends), <b>mettre</b> (je mets), <b>dire</b> (je dis), <b>voir</b> (je vois), <b>sortir</b> (je sors), <b>partir</b> (je pars).</p>
<p>Use the <b>Conjugator</b> above to see any verb in full.</p>`,
 ex:[['Je vais au bureau à pied.','I walk to the office.'],['Qu\'est-ce que tu fais ce soir ?','What are you doing tonight?'],['Nous pouvons commencer ?','Can we start?']],mc:[]},

{id:'neg-q',level:'A1',title:'Négation et questions',sub:'ne…pas, est-ce que, inversion',conj:null,
 rule:`<p><b>Negation</b> wraps the verb: <b>ne</b> + verb + <b>pas</b>. Before a vowel, ne → <b>n'</b>.</p>
<ul><li>ne … pas (not), ne … plus (not anymore), ne … jamais (never), ne … rien (nothing), ne … personne (nobody)</li>
<li>After a negation, <b>un / une / des / du / de la → de</b>: <i>Je n'ai pas <b>de</b> voiture.</i></li>
<li>With reflexive verbs, ne goes before the pronoun: <i>Je <b>ne</b> me lève <b>pas</b> tôt.</i></li>
<li>In speech, <b>ne</b> is often dropped: <i>Je sais pas.</i> Write it, but don't worry when you hear it missing.</li></ul>
<p><b>Three ways to ask a question</b></p>
<ul><li>Intonation (spoken): <i>Tu viens ce soir ?</i></li><li>Est-ce que: <i>Est-ce que tu viens ce soir ?</i></li><li>Inversion (formal): <i>Viens-tu ce soir ? Où habitez-vous ?</i></li></ul>`,
 ex:[['Je ne bois plus de café.',"I don't drink coffee anymore."],['Est-ce que vous parlez anglais ?','Do you speak English?'],['Où habitez-vous ?','Where do you live?']],
 mc:[["« I don't drink coffee anymore. »",["Je ne bois pas de café.","Je ne bois plus de café.","Je bois plus de café.","Je ne bois plus du café."],1,"ne…plus = not anymore; after a negation du → de."],
 ["« I don't have a car. »",["Je n'ai pas une voiture.","Je n'ai pas de voiture.","Je ai pas de voiture.","Je n'ai de voiture pas."],1,"un / une → de after a negation."],
 ["Formal question: « Where do you live? »",["Où tu habites ?","Où habitez-vous ?","Où vous habitez-vous ?","Où est-ce vous habitez ?"],1,"Inversion: verb-hyphen-subject."],
 ["« I never eat meat. »",["Je ne mange jamais de viande.","Je mange jamais la viande.","Je ne mange pas jamais de viande.","Je jamais mange de viande."],0,"ne…jamais replaces ne…pas; de after negation."],
 ["« I see nothing. »",["Je ne vois rien.","Je vois ne rien.","Je ne vois pas rien.","Je ne rien vois."],0,"ne…rien wraps the verb."],
 ["Which question is correct?",["Est-ce que tu viens ce soir ?","Est-ce que viens-tu ce soir ?","Est-ce tu viens ce soir ?","Est-que tu viens ce soir ?"],0,"Est-ce que + normal word order."],
 ["« I don't get up early. »",["Je ne me lève pas tôt.","Je me ne lève pas tôt.","Je ne lève me pas tôt.","Je ne me pas lève tôt."],0,"ne goes before the reflexive pronoun."]]},

{id:'pc-avoir',level:'A2',title:'Passé composé avec avoir',sub:'j\'ai mangé, j\'ai pris…',conj:{tenses:['pc'],verbs:'PC_AVOIR'},
 rule:`<p>Use the <b>passé composé</b> for finished actions: what you <i>did</i> yesterday, this morning, last weekend. It's the tense you need for talking about your day in class.</p>
<p><b>avoir</b> (présent) + <b>past participle</b></p>
<ul><li>-er → <b>-é</b>: parler → parlé, manger → mangé</li><li>-ir → <b>-i</b>: finir → fini, choisir → choisi</li><li>-re → <b>-u</b>: attendre → attendu, vendre → vendu</li></ul>
<p>Irregular participles to learn by heart: avoir → <b>eu</b>, être → <b>été</b>, faire → <b>fait</b>, prendre → <b>pris</b>, mettre → <b>mis</b>, dire → <b>dit</b>, écrire → <b>écrit</b>, voir → <b>vu</b>, lire → <b>lu</b>, boire → <b>bu</b>, pouvoir → <b>pu</b>, vouloir → <b>voulu</b>, devoir → <b>dû</b>, savoir → <b>su</b>, ouvrir → <b>ouvert</b>.</p>
<p>Negation wraps the auxiliary: <i>Je <b>n'</b>ai <b>pas</b> mangé.</i></p>`,
 ex:[["Ce matin, j'ai pris le bus.",'This morning I took the bus.'],["Hier, nous avons regardé un film.",'Yesterday we watched a film.'],["Je n'ai pas fini le rapport.","I haven't finished the report."]],
 mc:[["Past participle of « prendre »",["prendu","pris","prit","prendé"],1,"prendre → pris (also comprendre → compris, apprendre → appris)."],
 ["« Hier, nous ___ un film. »",["avons regardé","sommes regardés","avons regarder","regardions hier"],0,"avoir + participle -é."],
 ["Past participle of « faire »",["faisé","fait","fais","fai"],1,"faire → fait."],
 ["« J'___ le bus ce matin. »",["ai pris","suis pris","ai prendu","ai prenait"],0,"prendre uses avoir; participle pris."],
 ["Past participle of « voir »",["voyé","vu","vis","voit"],1,"voir → vu."],
 ["« Tu ___ mon mail ? »",["as lu","as lit","es lu","as lisé"],0,"lire → lu, with avoir."],
 ["Negative: « I didn't eat. »",["Je n'ai pas mangé.","Je n'ai mangé pas.","Je ne pas ai mangé.","Je n'ai pas manger."],0,"ne…pas wraps the auxiliary."]]},

{id:'pc-etre',level:'A2',title:'Passé composé avec être',sub:'je suis allé(e), je me suis levé(e)',conj:{tenses:['pc'],verbs:'PC_ETRE'},
 rule:`<p>About 15 verbs of <b>movement / change of state</b> use <b>être</b>, plus <b>all reflexive verbs</b>.</p>
<p>Memory trick <b>DR &amp; MRS VANDERTRAMP</b>: devenir, revenir, monter, rester, sortir, venir, aller, naître, descendre, entrer, rentrer, tomber, retourner, arriver, mourir, partir.</p>
<p>With être, the participle <b>agrees</b> with the subject like an adjective:</p>
<div class="tablewrap"><table><tr><th>subject</th><th>aller</th></tr>
<tr><td>je (man / woman)</td><td>je suis allé / allé<b>e</b></td></tr>
<tr><td>elle</td><td>elle est allé<b>e</b></td></tr>
<tr><td>nous</td><td>nous sommes allé<b>s</b> / allé<b>es</b></td></tr>
<tr><td>elles</td><td>elles sont allé<b>es</b></td></tr></table></div>
<p>Reflexive: <i>je <b>me suis</b> levé</i>, <i>elle <b>s'est</b> couchée</i>, <i>nous <b>nous sommes</b> dépêchés</i>.</p>
<p>In the drills, for je / tu / nous / vous both forms are accepted.</p>`,
 ex:[['Je suis arrivé au bureau à neuf heures.','I got to the office at nine.'],["Elle s'est levée tôt.",'She got up early.'],['Nous sommes rentrés tard.','We came home late.']],
 mc:[["« Elle ___ au Luxembourg en 2020. »",["a arrivé","est arrivée","est arrivé","a arrivée"],1,"arriver uses être; agree with elle → -e."],
 ["« Nous ___ à la maison. »",["sommes restés","avons restés","avons resté","sommes resté"],0,"rester uses être; plural → -s."],
 ["« Je ___ tôt ce matin. » (se lever, man)",["me suis levé","ai levé","me suis lever","m'ai levé"],0,"Reflexive verbs use être."],
 ["« Ils ___ en vacances hier. »",["ont partis","sont partis","sont parti","ont parti"],1,"partir uses être; plural → -s."],
 ["« Elles ___ au cinéma. »",["sont allées","sont allés","ont allé","sont allée"],0,"Feminine plural → -es."],
 ["Which verb takes être?",["manger","travailler","tomber","regarder"],2,"tomber is a DR & MRS VANDERTRAMP verb."],
 ["« Tu ___ où ? » (naître)",["es né(e)","as né","es naît","as naître"],0,"naître → né, with être."]]},

{id:'imparfait',level:'A2',title:"L'imparfait",sub:'descriptions, habitudes',conj:{tenses:['imparfait'],verbs:'MIX'},
 rule:`<p>The <b>imparfait</b> describes the background: how things <i>were</i>, what you <i>used to do</i>, what <i>was happening</i>.</p>
<p>Formation: take <b>nous</b> in the présent, remove <b>-ons</b>, add <b>-ais, -ais, -ait, -ions, -iez, -aient</b>.</p>
<div class="tablewrap"><table><tr><th>verb</th><th>nous (présent)</th><th>imparfait</th></tr>
<tr><td>parler</td><td>parl-ons</td><td>je parl<b>ais</b></td></tr>
<tr><td>finir</td><td>finiss-ons</td><td>je finiss<b>ais</b></td></tr>
<tr><td>faire</td><td>fais-ons</td><td>je fais<b>ais</b></td></tr>
<tr><td>être</td><td>(exception)</td><td>j'<b>étais</b></td></tr></table></div>
<p>Key uses: <b>c'était</b> (it was), <b>il faisait beau</b>, <b>il y avait</b> (there was), <b>j'étais fatigué</b>, <b>je voulais</b>.</p>`,
 ex:[["C'était une longue journée.",'It was a long day.'],['Il faisait froid et il pleuvait.','It was cold and raining.'],["Quand j'étais petit, je jouais au foot.",'When I was little, I used to play football.']],
 mc:[["« Quand j'étais petit, je ___ au foot. »",["jouais","ai joué","jouerai","joue"],0,"Habit in the past → imparfait."],
 ["« Il ___ beau ce jour-là. »",["faisait","a fait","fera","fait"],0,"Weather description → imparfait."],
 ["« être », je (imparfait)",["étais","suis","étés","serais"],0,"être is the only irregular stem: ét-."],
 ["« Nous ___ à la cantine. » (manger)",["mangions","mangeons","mangeions","mangerions"],0,"No e before -ions: mangions."],
 ["« finir », je (imparfait)",["finissais","finirais","finais","finissait"],0,"From nous finissons → finiss-ais."]]},

{id:'pc-imp',level:'B1',title:'Passé composé ou imparfait ?',sub:'raconter une histoire',conj:null,
 rule:`<p>When you tell your teacher about your day, you mix both tenses.</p>
<div class="tablewrap"><table><tr><th>Passé composé — events</th><th>Imparfait — background</th></tr>
<tr><td>Finished, one-off actions</td><td>Descriptions (weather, feelings, places)</td></tr>
<tr><td>A sequence: d'abord… ensuite… enfin</td><td>Habits: tous les jours, souvent</td></tr>
<tr><td>Sudden: soudain, tout à coup</td><td>Ongoing action interrupted: pendant que…</td></tr>
<tr><td>A precise duration: pendant deux heures</td><td>État: j'étais, j'avais, il y avait</td></tr></table></div>
<p>Picture a film: the <b>imparfait</b> is the set and the lighting, the <b>passé composé</b> is what the actors do.</p>
<p class="ex">Il <b>pleuvait</b> (décor) quand je <b>suis sorti</b> (événement).</p>`,
 ex:[['Je regardais la télé quand le téléphone a sonné.','I was watching TV when the phone rang.'],["Il faisait beau, alors nous sommes allés au parc.",'The weather was nice, so we went to the park.']],
 mc:[["« Je ___ la télé quand le téléphone a sonné. »",["regardais","ai regardé"],0,"Ongoing action that gets interrupted."],
 ["« Hier, je ___ à Metz. » (one trip)",["suis allé","allais"],0,"One finished event."],
 ["« Quand j'étais jeune, nous ___ souvent à la mer. »",["allions","sommes allés"],0,"Habit (souvent)."],
 ["« Soudain, il ___ à pleuvoir. »",["a commencé","commençait"],0,"Sudden event."],
 ["« Il ___ froid et il y avait du vent. »",["faisait","a fait"],0,"Description of the weather."],
 ["« Samedi, j'___ trois heures de sport. »",["ai fait","faisais"],0,"Finished action with a precise duration."],
 ["« Elle ___ fatiguée, alors elle s'est couchée tôt. »",["était","a été"],0,"A state / feeling → imparfait."],
 ["« Tous les matins, je ___ le bus de 7 h 30. »",["prenais","ai pris"],0,"Repeated habit."]]},

{id:'futur',level:'A2',title:'Le futur',sub:'je vais partir, je partirai',conj:{tenses:['futur'],verbs:'MIX'},
 rule:`<p><b>Futur proche</b> (spoken, near future): <b>aller</b> + infinitive. <i>Je <b>vais</b> travailler demain.</i></p>
<p><b>Futur simple</b>: infinitive + <b>-ai, -as, -a, -ons, -ez, -ont</b> (drop the final -e of -re verbs).</p>
<p class="ex">parler → je parler<b>ai</b> · prendre → je prendr<b>ai</b> · finir → nous finir<b>ons</b></p>
<p>Irregular stems (same endings): être → <b>ser-</b>, avoir → <b>aur-</b>, aller → <b>ir-</b>, faire → <b>fer-</b>, pouvoir → <b>pourr-</b>, vouloir → <b>voudr-</b>, devoir → <b>devr-</b>, savoir → <b>saur-</b>, venir → <b>viendr-</b>, voir → <b>verr-</b>, envoyer → <b>enverr-</b>.</p>
<p>After <b>quand</b> about the future, French uses the futur: <i>Quand j'<b>aurai</b> le temps, je t'appellerai.</i></p>`,
 ex:[['Demain, je vais aller chez le médecin.',"Tomorrow I'm going to the doctor."],["L'année prochaine, nous déménagerons.",'Next year we will move.'],['Quand tu seras là, on mangera.',"When you're here, we'll eat."]],
 mc:[["« Demain, je ___ chez le médecin. » (futur proche)",["vais aller","vais allé","vais à aller","irai aller"],0,"aller + infinitive."],
 ["être, nous (futur)",["serons","étrons","serions","sommes"],0,"Stem ser-."],
 ["« Quand j'___ le temps, je t'appellerai. »",["aurai","ai","avais","aurais"],0,"Futur after quand (future meaning)."],
 ["pouvoir, tu (futur)",["pourras","pouvras","peux","pourrais"],0,"Stem pourr-."],
 ["faire, ils (futur)",["feront","fairont","font","ferons"],0,"Stem fer-."],
 ["« Si j'ai le temps, je ___. » (venir)",["viendrai","viendrais","venirai","venais"],0,"si + présent → futur."]]},

{id:'pronoms',level:'B1',title:'Les pronoms',sub:'le, lui, y, en',conj:null,
 rule:`<p>Pronouns go <b>before the verb</b> (before the auxiliary in the passé composé).</p>
<div class="tablewrap"><table><tr><th>Replaces</th><th>Pronoun</th><th>Example</th></tr>
<tr><td>direct object (no preposition)</td><td>le, la, l', les</td><td>Je vois Marie → Je <b>la</b> vois.</td></tr>
<tr><td>à + person</td><td>lui, leur</td><td>Je parle à Paul → Je <b>lui</b> parle.</td></tr>
<tr><td>à / en / chez + place</td><td>y</td><td>Je vais à Paris → J'<b>y</b> vais.</td></tr>
<tr><td>de + thing, quantity, du/des</td><td>en</td><td>Je veux du café → J'<b>en</b> veux.</td></tr></table></div>
<p>Order with two pronouns: <b>me/te/nous/vous → le/la/les → lui/leur → y → en</b>. <i>Il <b>me le</b> donne. Je <b>le lui</b> donne.</i></p>
<p>Passé composé agreement: with a direct object pronoun before avoir, the participle agrees: <i>Les documents ? Je les ai envoyé<b>s</b>.</i></p>`,
 ex:[["Tu connais Sophie ? — Oui, je la connais.",'Do you know Sophie? — Yes, I know her.'],["Tu vas au bureau ? — Oui, j'y vais.",'Are you going to the office? — Yes, I am.'],["Tu as des enfants ? — Oui, j'en ai deux.",'Do you have children? — Yes, I have two.']],
 mc:[["« Tu vois Marie ? — Oui, je ___ vois. »",["la","lui","le","en"],0,"Direct object, feminine → la."],
 ["« Tu parles à ton chef ? — Oui, je ___ parle. »",["lui","le","la","y"],0,"à + person → lui."],
 ["« Tu vas à Paris ? — Oui, j'___ vais demain. »",["y","en","le","lui"],0,"à + place → y."],
 ["« Tu veux du café ? — Oui, j'___ veux bien. »",["en","le","y","lui"],0,"du / de la / des → en."],
 ["« Tu as envoyé les documents ? — Oui, je ___ ai envoyés. »",["les","leur","en","y"],0,"Direct object plural → les (and agreement -s)."],
 ["« Tu téléphones à tes parents ? — Oui, je ___ téléphone. »",["leur","les","lui","y"],0,"à + several people → leur."],
 ["« Il donne le livre à moi. »",["Il me le donne.","Il le me donne.","Il me donne le.","Il le donne me."],0,"Order: me before le."]]},

{id:'cond',level:'B1',title:'Le conditionnel',sub:'je voudrais, si j\'avais…',conj:{tenses:['cond'],verbs:'MIX'},
 rule:`<p>Formation: <b>futur stem</b> + <b>imparfait endings</b> (-ais, -ais, -ait, -ions, -iez, -aient).</p>
<p class="ex">parler → je parler<b>ais</b> · être → je <b>serais</b> · pouvoir → tu <b>pourrais</b> · vouloir → je <b>voudrais</b></p>
<p><b>Three uses</b></p>
<ul><li>Politeness: <i>Je <b>voudrais</b> un café. <b>Pourriez</b>-vous m'aider ?</i></li>
<li>Advice: <i>À ta place, je <b>prendrais</b> ce travail. Tu <b>devrais</b> te reposer.</i></li>
<li>Hypothesis: <b>si + imparfait → conditionnel</b>: <i>Si j'<b>avais</b> le temps, je <b>lirais</b> plus.</i></li></ul>
<p>Never put the conditionnel right after <b>si</b>.</p>`,
 ex:[['Je voudrais réserver une table.',"I'd like to book a table."],['Si j\'étais riche, je voyagerais.','If I were rich, I would travel.'],['Tu devrais parler plus souvent.','You should speak more often.']],
 mc:[["« Je ___ un café, s'il vous plaît. »",["voudrais","voudrai","veux voudrais","voulais"],0,"Politeness → conditionnel."],
 ["« Si j'avais plus de temps, je ___ plus. »",["lirais","lirai","lis","lisais"],0,"si + imparfait → conditionnel."],
 ["« Tu ___ m'aider ? » (polite)",["pourrais","pourras","pouvais","peux-tu"],0,"pouvoir → pourr- + ais."],
 ["« À ta place, je ___ ce travail. »",["prendrais","prendrai","prenais","prends"],0,"Advice → conditionnel."],
 ["aimer, nous (conditionnel)",["aimerions","aimerons","aimions","aimerais"],0,"aimer- + ions."],
 ["« Si j'___ riche, j'achèterais une maison. »",["étais","serais","suis","serai"],0,"After si: imparfait, not conditionnel."]]},

{id:'pqp',level:'B1',title:'Le plus-que-parfait',sub:"j'avais fini, j'étais parti",conj:{tenses:['pqp'],verbs:'MIX'},
 rule:`<p>The past <b>before</b> another past. Auxiliary in the <b>imparfait</b> + participle.</p>
<p class="ex">Quand je suis arrivé, le film <b>avait</b> déjà <b>commencé</b>.</p>
<p>Same être / avoir choice and agreement as the passé composé: <i>Elle <b>était partie</b>.</i></p>
<p>Very common in reported speech: <i>Il m'a dit qu'il <b>avait fini</b>.</i></p>`,
 ex:[["J'avais oublié mes clés.",'I had forgotten my keys.'],["Nous étions déjà partis.",'We had already left.']],
 mc:[["« Quand je suis arrivé, le film ___ déjà ___. »",["avait … commencé","a … commencé","était … commencé","avait … commençait"],0,"Earlier past → plus-que-parfait."],
 ["« Elle ___ déjà ___ quand j'ai appelé. » (partir)",["était … partie","avait … parti","était … parti","a … partie"],0,"partir uses être; agreement -e."],
 ["« Je ne savais pas que tu ___ malade. »",["avais été","as été","serais","seras"],0,"Earlier state in the past."],
 ["« Nous ___ le restaurant la veille. »",["avions réservé","avons réservé","étions réservés","avions réserver"],0,"The day before → earlier past."],
 ["« Il m'a dit qu'il ___ son travail. »",["avait fini","a fini","finira","finissait"],0,"Reported speech, earlier action."]]},

{id:'relatifs',level:'B1',title:'Les pronoms relatifs',sub:'qui, que, où, dont',conj:null,
 rule:`<ul><li><b>qui</b> = subject: <i>le collègue <b>qui</b> travaille avec moi</i></li>
<li><b>que</b> = direct object: <i>le livre <b>que</b> je lis</i></li>
<li><b>où</b> = place or time: <i>la ville <b>où</b> j'habite</i>, <i>le jour <b>où</b> je suis arrivé</i></li>
<li><b>dont</b> = replaces de + …: <i>le projet <b>dont</b> je t'ai parlé</i> (parler <b>de</b>)</li></ul>
<p><b>ce qui / ce que</b> = what: <i><b>Ce que</b> je veux, c'est progresser.</i></p>`,
 ex:[['C\'est la ville où je suis né.','It\'s the town where I was born.'],['Le film dont tout le monde parle.','The film everyone is talking about.']],
 mc:[["« C'est le collègue ___ travaille avec moi. »",["qui","que","dont","où"],0,"Subject → qui."],
 ["« Le livre ___ je lis est génial. »",["que","qui","dont","où"],0,"Object → que."],
 ["« La ville ___ j'habite est calme. »",["où","que","qui","dont"],0,"Place → où."],
 ["« Le projet ___ je t'ai parlé. »",["dont","que","qui","où"],0,"parler DE → dont."],
 ["« Le jour ___ je suis arrivé, il pleuvait. »",["où","que","quand","dont"],0,"Time → où."],
 ["« C'est ce ___ je veux. »",["que","qui","dont","où"],0,"vouloir quelque chose → ce que."]]},

{id:'subj',level:'B2',title:'Le subjonctif présent',sub:'il faut que je parte',conj:{tenses:['subj'],verbs:'MIX'},
 rule:`<p>Formation: <b>ils</b> (présent) minus <b>-ent</b> + <b>-e, -es, -e, -ent</b>; <b>nous/vous</b> = imparfait forms.</p>
<p class="ex">prendre → ils prenn-ent → que je prenn<b>e</b>, que nous pren<b>ions</b></p>
<p>Irregular: être (que je <b>sois</b>), avoir (que j'<b>aie</b>), aller (que j'<b>aille</b>), faire (que je <b>fasse</b>), pouvoir (que je <b>puisse</b>), savoir (que je <b>sache</b>), vouloir (que je <b>veuille</b>).</p>
<p><b>When?</b> After expressions of necessity, wish, emotion, doubt, and some conjunctions:</p>
<ul><li>il faut que, je veux que, j'aimerais que</li><li>je suis content que, j'ai peur que</li><li>je doute que, je ne pense pas que</li><li>bien que, pour que, avant que, à condition que</li></ul>
<p>But <b>je pense que / je crois que</b> (affirmative) take the indicatif.</p>`,
 ex:[['Il faut que je parte.','I have to leave.'],['Je veux que tu viennes.','I want you to come.'],['Bien qu\'il soit tard, on continue.','Although it\'s late, we keep going.']],
 mc:[["« Il faut que tu ___. » (venir)",["viennes","viens","viendras","venais"],0,"il faut que + subjonctif."],
 ["« Je veux que vous ___ attention. » (faire)",["fassiez","faites","faisiez","ferez"],0,"faire → fass-."],
 ["« Bien qu'il ___ tard, on continue. »",["soit","est","sera","était"],0,"bien que + subjonctif."],
 ["« Je pense qu'il ___ raison. »",["a","ait"],0,"penser (affirmative) → indicatif."],
 ["« Je ne pense pas qu'il ___ raison. »",["ait","a"],0,"Negative opinion → subjonctif."],
 ["« Je suis content que tu ___ là. »",["sois","es","seras","étais"],0,"Emotion → subjonctif."],
 ["« Avant que nous ___… » (partir)",["partions","partons","partirons","partîmes"],0,"avant que + subjonctif."]]}
];

function present(v){
  if(IRR[v]) return IRR[v].split(' ');
  if(DERIV[v]){const [b,p,replaceFirst]=DERIV[v];return present(b).map(f=>replaceFirst?p+f.slice(1):p+f);}
  if(v.endsWith('er')){const s=v.slice(0,-2);const f=[s+'e',s+'es',s+'e',s+'ons',s+'ez',s+'ent'];if(s.endsWith('g'))f[3]=s+'eons';if(s.endsWith('c'))f[3]=s.slice(0,-1)+'çons';return f;}
  if(v.endsWith('ir')){const s=v.slice(0,-2);return [s+'is',s+'is',s+'it',s+'issons',s+'issez',s+'issent'];}
  if(v.endsWith('re')){const s=v.slice(0,-2);return [s+'s',s+'s',s,s+'ons',s+'ez',s+'ent'];}
  return null;
}
function imparfait(v){
  const E=['ais','ais','ait','ions','iez','aient'];
  let st=v==='être'?'ét':present(v)[3].replace(/ons$/,'');
  return E.map(e=>{let s=st;if(e[0]==='i'){s=s.replace(/ge$/,'g').replace(/ç$/,'c');}return s+e;});
}
function futStem(v){
  if(FUT[v]) return FUT[v];
  if(DERIV[v]){const [b,p,r]=DERIV[v];const bs=futStem(b);return r?p+bs.slice(1):p+bs;}
  return v.endsWith('re')?v.slice(0,-1):v;
}
const futur=v=>['ai','as','a','ons','ez','ont'].map(e=>futStem(v)+e);
const cond=v=>['ais','ais','ait','ions','iez','aient'].map(e=>futStem(v)+e);
function subj(v){

  const p=present(v),im=imparfait(v),s=p[5].replace(/ent$/,'');
  return [s+'e',s+'es',s+'e',im[3],im[4],s+'ent'];
}
function participle(v){
  if(PP[v]) return PP[v];
  if(DERIV[v]){const [b,p,r]=DERIV[v];const bp=participle(b);return r?p+bp.slice(1):p+bp;}
  if(v.endsWith('er')) return v.slice(0,-2)+'é';
  if(v.endsWith('ir')) return v.slice(0,-2)+'i';
  if(v.endsWith('re')) return v.slice(0,-2)+'u';
  return v;
}
function agreeForms(pp,person){
  const f=pp+'e',mp=pp+(pp.endsWith('s')?'':'s'),fp=pp+'es';
  switch(person){case 'je':case 'tu':return [pp,f];case 'il':return [pp];case 'elle':return [f];case 'nous':return [mp,fp];case 'vous':return [pp,f,mp,fp];case 'ils':return [mp];case 'elles':return [fp];}
  return [pp];
}
function compound(v,person,auxTense){

  const auxF=(auxTense==='imparfait'?imparfait(aux):present(aux))[i];

function conjugate(v,tense,person){
  const i=PIDX[person];

    case 'imparfait':return [imparfait(v)[i]];
    case 'futur':return [futur(v)[i]];
    case 'cond':return [cond(v)[i]];

}
function subjLabel(person,form,tense){

const Sync={col:null,ready:false,timer:null,busy:false,
  async init(){
    try{
      if(!window.claude||!window.claude.use) return;
      const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      if(!db||!user) return;
      const id=await user.id(); if(!id) return;
      this.col=db.collection('data/users/'+id);
      const snap=await this.col.get();
      let remote=null;const rtexts=[];
      snap.docs.forEach(d=>{if(!d.exists)return;if(d.id==='state')remote=d.data();else if(d.id.startsWith('t_'))rtexts.push(d.data());});
      this.ready=true;
      if(remote&&(remote.updatedAt||0)>(ST.updatedAt||0)){ST=migrate(JSON.parse(JSON.stringify(remote)));lsSet(LS_KEY,ST);}
      else if(ST.updatedAt) this.pushState();
      const map=new Map(USER_TEXTS.map(t=>[t.id,t]));
      rtexts.forEach(t=>{const l=map.get(t.id);if(!l||(t.updatedAt||0)>(l.updatedAt||0))map.set(t.id,JSON.parse(JSON.stringify(t)));});
      const localOnly=USER_TEXTS.filter(t=>!rtexts.some(r=>r.id===t.id));
      USER_TEXTS=[...map.values()].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      lsSet(LS_TEXTS,USER_TEXTS);
      for(const t of localOnly) await this.saveText(t);
      render(true);
    }catch(e){console.warn('sync',e);}
  },
  pushState(){
    if(!this.ready||!this.col) return;
    clearTimeout(this.timer);
    this.timer=setTimeout(async()=>{
      if(this.busy){this.pushState();return;}
      this.busy=true;
      try{await this.col.doc('state').set(JSON.parse(JSON.stringify(ST)));}catch(e){console.warn('save',e);}
      this.busy=false;

  },

function fileToB64(f){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(f);
  img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res({type:'image/jpeg',b64:c.toDataURL('image/jpeg',0.85).split(',')[1]});};
  img.onerror=()=>{URL.revokeObjectURL(url);rej({code:'image_rejected'});};img.src=url;});}
function extErr(status,d){
  const raw=(d&&d.error&&(d.error.message||d.error.status))||(d&&(d.message||d.detail&&JSON.stringify(d.detail)))||'';
  const msg=String(raw).toLowerCase();
  const base={status,detail:String(raw).slice(0,180)};
  if(status===401||status===403||(status===400&&/api[ _-]?key/.test(msg)))return {code:'bad_key',...base};
  if(status===404)return {code:'bad_model',...base};
  if(status===429)return {code:'rate_limited',...base};
  if(status===413)return {code:'prompt_too_large',...base};
  return {code:'upstream_error',...base};
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function extRequest(prov,model,key,merged,imgs,json,signal){
  let res,d;
  try{
    if(prov==='gemini'){
      const contents=merged.map((t,i)=>({role:t.role==='assistant'?'model':'user',parts:[{text:t.content},...(i===merged.length-1?imgs.map(im=>({inline_data:{mime_type:im.type,data:im.b64}})):[])]}));
      const gc=json?{responseMimeType:'application/json',temperature:0.4}:{temperature:0.7};
      res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents,generationConfig:gc}),signal});
    }else{
      const messages=merged.map((t,i)=>({role:t.role,content:(i===merged.length-1&&imgs.length)?[{type:'text',text:t.content},...imgs.map(im=>({type:'image_url',image_url:`data:${im.type};base64,${im.b64}`}))]:t.content}));
      res=await fetch('https://api.mistral.ai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,messages,temperature:json?0.3:0.7,...(json?{response_format:{type:'json_object'}}:{})}),signal});
    }
    d=await res.json().catch(()=>({}));
  }catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};throw {code:'network'};}
  if(!res.ok) throw extErr(res.status,d);
  let txt='';
  if(prov==='gemini'){
    const c=d.candidates&&d.candidates[0];
    txt=((c&&c.content&&c.content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');
    if(!txt){const why=(d.promptFeedback&&d.promptFeedback.blockReason)||(c&&c.finishReason)||'';throw {code:/SAFETY|BLOCK|PROHIBITED/.test(why)?'refused':'empty_completion',detail:why};}
  }else{const m=d.choices&&d.choices[0]&&d.choices[0].message;const c=m&&m.content;txt=Array.isArray(c)?c.map(x=>x.text||'').join(''):String(c||'');if(!txt)throw {code:'empty_completion'};}
  return txt;
}
async function extCall(prov,turns,{json=false,images=null,signal}={}){
  const key=aiKey(prov);let model=aiModel(prov);
  if(!key) throw {code:'unavailable'};
  const imgs=[];if(images){const list=images instanceof Blob?[images]:[...images];for(const f of list.slice(0,3))imgs.push(await fileToB64(f));}
  const merged=[];for(const t of turns){const role=t.role==='assistant'?'assistant':'user';const last=merged[merged.length-1];if(last&&last.role===role)last.content+='\n\n'+t.content;else merged.push({role,content:String(t.content)});}
  const custom=(localStorage.getItem('cahier.ai.model.'+prov)||'').trim();
  const fallbacks=prov==='gemini'?[model,...(custom?[]:['gemini-2.5-flash','gemini-2.5-flash-lite'])]:[model,...(custom?[]:['mistral-small-2506','open-mistral-nemo'])];
  let lastErr=null,useJson=json;
  for(const m of [...new Set(fallbacks)]){
    for(let attempt=0;attempt<3;attempt++){
      try{return await extRequest(prov,m,key,merged,imgs,useJson,signal);}
      catch(e){
        lastErr=e;
        if(e.code==='cancelled'||e.code==='bad_key'||e.code==='network'||e.code==='refused'||e.code==='prompt_too_large') throw e;
        if(e.code==='upstream_error'&&e.status===400&&useJson){useJson=false;continue;}
        if(e.code==='bad_model') break;
        if((e.code==='upstream_error'&&(!e.status||e.status>=500))||e.code==='rate_limited'||e.code==='empty_completion'){ if(attempt<2){await sleep(1200*(attempt+1));continue;} break; }
        break;
      }
    }
  }
  throw lastErr||{code:'upstream_error'};
}
const AI={fn:null,state:'loading',images:null,prov:null,claudeImages:null,

      if(IN_CLAUDE){const s=await claude.use('sample');if(s){this.fn=s;try{const l=await s.limits();this.claudeImages=l&&l.images?l.images:null;}catch(e){}}}

  }
};
function aiMsg(e){
  const c=e&&e.code;
  if(AI.prov==='claude'&&(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled')){AI.state='denied';paintAI();return 'Claude access is off for this page, so AI features are paused. Reload the page to be asked again.';}
  const who=AI.name();
  const extra=e&&e.detail&&AI.prov!=='claude'?` (${who}: ${e.detail})`:'';
  return (({rate_limited:`${who}'s limit is reached for now. Wait a minute (or until tomorrow for the daily free limit), then try again.`,invalid_json:'The answer came back in an unexpected format. Try again.',refused:`${who} declined this request. Try rephrasing it.`,session_expired:'Your Claude session expired. Sign in again, then retry.',prompt_too_large:'That text is too long. Try a shorter part.',unavailable:'AI features need a connection: add a free Gemini or Mistral key in Réglages → AI, or open the app inside Claude.',image_rejected:"That image couldn't be read. Try a clearer JPG or PNG photo.",images_unavailable:"Photos can't be sent from this view. Paste the text instead.",cancelled:'Stopped.',empty_completion:'No answer came back. Try again.',bad_key:`Your ${who} key was refused. Check it in Réglages → AI.`,bad_model:`${who} doesn't know that model name. Reset it in Réglages → AI.`,network:`Couldn't reach ${who}. Check your internet connection and try again.`})[c]||`Something went wrong reaching ${who}. Try again.`)+extra;
}

const TTS={ok:typeof window.speechSynthesis!=='undefined',voices:[],btn:null,
  init(){if(!this.ok)return;const load=()=>{try{this.voices=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang));}catch(e){}};load();try{speechSynthesis.addEventListener('voiceschanged',load);}catch(e){}},
  voice(){const v=this.voices;return v.find(x=>x.name===ST.voice)||v.find(x=>/fr[-_]FR/i.test(x.lang)&&/(google|premium|enhanced|natural|amélie|audrey|thomas|denise|henri)/i.test(x.name))||v.find(x=>/fr[-_]FR/i.test(x.lang))||v[0]||null;},
  speak(text,{rate,onend,btn}={}){
    if(!this.ok){toast('Read-aloud is not available in this browser.');onend&&onend();return;}
    this.stop();
    const clean=String(text).replace(/[—«»"“”]/g,' ').replace(/\(e\)/g,'').replace(/…/g,'.');
    const u=new SpeechSynthesisUtterance(clean);
    u.lang='fr-FR';const v=this.voice();if(v)u.voice=v;u.rate=rate||ST.rate;
    if(btn){this.btn=btn;btn.classList.add('speaking');}
    const done=()=>{if(btn)btn.classList.remove('speaking');if(this.cur===u){this.cur=null;onend&&onend();}};
    u.onend=done;u.onerror=done;this.cur=u;
    setTimeout(()=>{try{speechSynthesis.speak(u);}catch(e){done();}},40);
  },
  stop(){if(!this.ok)return;this.cur=null;try{speechSynthesis.cancel();}catch(e){}$$('.iconbtn.speaking').forEach(b=>b.classList.remove('speaking'));}
};

/* On-device translation where the browser offers it (Translator API). Free, private, no Claude usage. */
const DeviceTR={inst:{},
  has(){return typeof self!=='undefined'&&'Translator' in self;},
  /* only reports 'available' once the translator has worked here before; never probes on its own */
  async status(){return this.has()?(ST.devTrOK?'available':'maybe'):'no';},
  async translate(text,from='fr',to='en'){const k=from+to;
    const run=async()=>{if(!this.inst[k])this.inst[k]=await self.Translator.create({sourceLanguage:from,targetLanguage:to});return this.inst[k].translate(text);};
    const r=await Promise.race([run(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),20000))]);
    if(!ST.devTrOK){ST.devTrOK=1;save();}return r;}
};

function findWord(fr){const n=normAns(fr);return ST.customVocab.find(w=>normAns(w.fr)===n)||VOCAB.find(w=>normAns(w.fr)===n);}
function notebookWords(){const refs=new Set(ST.nbRefs||[]);return [...ST.customVocab,...VOCAB.filter(w=>refs.has(w.id))].sort((a,b)=>(b.added||0)-(a.added||0));}
function addCustomWord(fr,en,ex,theme='Mes mots',extra={}){
  fr=String(fr).trim();if(!fr)return null;
  const ex0=findWord(fr);
  if(ex0){
    if(ex0.custom){if(en&&!ex0.en)ex0.en=String(en).trim();if(ex&&!ex0.ex)ex0.ex=ex;Object.assign(ex0,extra);save();toast('Already in your notebook ✓');return ex0;}
    ST.nbRefs=ST.nbRefs||[];if(!ST.nbRefs.includes(ex0.id)){ST.nbRefs.push(ex0.id);ex0.added=Date.now();}
    save();toast('Added to your notebook ✓',true);return ex0;
  }
  const w={id:'c'+uid(),fr,en:String(en||'').trim(),ex:ex||'',level:ST.level,theme,custom:1,added:Date.now(),...extra};
  ST.customVocab.push(w);save();toast('Added to your notebook ✓',true);paintChrome();return w;
}

/* ================= EXERCICES DU PROF (fill-in-the-blank worksheets) ================= */
const BLANK_RE=/_{3,}|…{2,}|\.{5,}/g;
const SUBJ_PRON={'je':'je',"j'":'je','tu':'tu','il':'il','elle':'elle','on':'il','nous':'nous','vous':'vous','ils':'ils','elles':'elles'};
function sheetTense(s){
  s=stripAcc(String(s).toLowerCase());
  if(/plus-que-parfait/.test(s))return 'pqp';
  if(/passe compose/.test(s))return 'pc';
  if(/imparfait/.test(s))return 'imparfait';
  if(/futur proche/.test(s))return null;
  if(/futur/.test(s))return 'futur';
  if(/conditionnel/.test(s))return 'cond';
  if(/subjonctif/.test(s))return 'subj';
  if(/present/.test(s))return 'present';
  return null;
}
function checkableVerb(v){
  if(!v||/\s/.test(v)) return false;
  if(ALL_VERBS.includes(v)) return true;
  if(/er$/.test(v)&&!/[eé][^aeiouyé]+er$/.test(v)&&!/yer$/.test(v)) return true;
  return false;
}
function personFromContext(before){
  const clause=before.toLowerCase().replace(/[’]/g,"'").split(/[,;:]/).pop();
  const toks=clause.replace(/(j'|l'|n'|m'|t'|s')/g,' $1 ').split(/\s+/).filter(Boolean);
  for(const t of toks){if(SUBJ_PRON[t])return {p:SUBJ_PRON[t],sure:true};}
  if(!toks.length) return null;
  if(/\b(les|des|mes|tes|ses|nos|vos|leurs|ces|plusieurs|beaucoup)\b/.test(clause)||/\bet\b/.test(clause)) return {p:'ils',noun:true};
  return {p:'il',noun:true};
}
function localAnswers(verb,tense,before){
  if(!tense||!checkableVerb(verb)) return null;
  const ps=personFromContext(before);if(!ps) return null;
  try{
    let a=conjugate(verb,tense,ps.p);
    if(ps.noun&&(ps.p==='il'||ps.p==='ils')) a=[...new Set([...a,...conjugate(verb,tense,ps.p==='il'?'elle':'elles')])];
    return a;
  }catch(e){return null;}
}
function parseSheet(raw,titleHint){
  let lines=String(raw).replace(/\r/g,'').split('\n').map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim());
  const numRe=/^\s*\d+\s*[.)\-–]?\s*/;
  const isHead=t=>/^(exercice|ex\.?\s*\d|partie|activité)/i.test(t);
  const numbered=lines.filter(l=>numRe.test(l)&&/^\s*\d/.test(l)).length>=3;
  if(numbered){const out=[];for(const l of lines){const t=l.trim();if(out.length&&!/^\d/.test(t)&&!isHead(t)&&!isHead(out[out.length-1]))out[out.length-1]+=' '+t;else out.push(t);}lines=out;}
  const sections=[];let cur=null;
  const newSec=title=>{cur={title:title||'',instr:[],tense:null,items:[]};sections.push(cur);};
  for(let l of lines){
    const t=l.trim();
    if(isHead(t)){newSec(t);continue;}
    if(!cur)newSec('');
    const body=t.replace(/^\s*\d+\s*[.)\-–]?\s*/,'');
    BLANK_RE.lastIndex=0;
    if(!BLANK_RE.test(body)){cur.instr.push(body.replace(/^consigne\s*:\s*/i,''));continue;}
    cur.items.push({text:body});
  }
  for(const s of sections){
    s.tense=sheetTense(s.title+' '+s.instr.join(' '));
    for(const it of s.items){
      const parts=it.text.split(BLANK_RE);
      it.blanks=[];
      for(let b=0;b<parts.length-1;b++){
        const after=parts[b+1],m=after.match(/^\s*\(([^)]+)\)/);
        const hint=m?m[1].trim():'';
        const before=parts.slice(0,b+1).join(' … ');
        it.blanks.push({hint,local:localAnswers(normAns(hint),s.tense,parts[b])||null});
      }
      it.ans=it.blanks.map(()=>'');it.res=it.blanks.map(()=>null);
    }
  }
  const secs=sections.filter(s=>s.items.length||s.instr.length);
  const title=titleHint||(secs[0]&&secs[0].title)||('Exercice du '+frDate(Date.now(),{day:'numeric',month:'long'}));
  return {title,sections:secs};
}
function sheetCount(sh){return sh.sections.reduce((n,s)=>n+s.items.length,0);}

function sentenceWith(it,useCorrect){
  const parts=it.text.split(BLANK_RE);let out=parts[0];
  for(let b=0;b<it.blanks.length;b++){
    const a=(useCorrect&&(it.res[b]==='bad'||!it.ans[b])&&it.blanks[b].right)?it.blanks[b].right:(it.ans[b]||(useCorrect&&it.blanks[b].local?it.blanks[b].local[0]:'…'));
    out+=a+parts[b+1].replace(/^\s*\([^)]*\)/,'');
  }
  return out.replace(/\s+/g,' ').trim();
}

function tokenHtml(s){

  while((m=re.exec(s))){out+=esc(s.slice(last,m.index))+`<span class="w" data-w="${esc(m[0])}">${esc(m[0])}</span>`;last=m.index+m[0].length;}

}
function localLookup(word,text){
  const w=normAns(word);

async function wordPop(el,word,sent,text){
  const loc=localLookup(word,text);
  const body=(r)=>`<div class="row between" style="gap:8px"><span class="pw">${esc(word)}</span>${spk(word)}</div>
   ${r?`${r.lemma&&normAns(r.lemma)!==normAns(word)?`<div class="small muted">from <b>${esc(r.lemma)}</b>${r.pos?' · '+esc(r.pos):''}</div>`:r.fr&&normAns(r.fr)!==normAns(word)?`<div class="small muted">in <b>${esc(r.fr)}</b></div>`:''}

   <div id="pop-extra"></div>
   <div class="row" style="margin-top:10px;gap:6px"><button class="btn sm primary" id="pop-add" type="button">+ Notebook</button>${sent.en?`<button class="btn sm" id="pop-sent" type="button">Translate sentence</button>`:''}</div>`;
  const wire=(r)=>{

    const s=$('#pop-sent');if(s)s.onclick=()=>{$('#pop-extra').innerHTML=`<div class="note" style="margin-top:8px">${esc(sent.en)}</div>`;s.remove();};
  };
  if(loc){showPop(el,body(loc));wire(loc);return;}
  if(!AI.on()){
    const dev=await DeviceTR.status('fr','en');
    if(dev==='available'){try{const en=await DeviceTR.translate(word);const r={en,note:'Translated on this device'};showPop(el,body(r));wire(r);return;}catch(e){}}
    showPop(el,body(null)+`<div class="small muted" style="margin-top:6px">Not in the app's word lists. Select the word and tap <b>Translate</b> (Apple Translate), or add it to your notebook and paste the meaning.</div>`);wire(null);return;}
  showPop(el,`<div class="row between"><span class="pw">${esc(word)}</span>${spk(word)}</div>${thinking('Looking it up…')}`);
  try{
    const r=await AI.json(`French word "${word}" in this sentence: "${sent.fr}". Reply with only JSON: {"lemma":"dictionary form","pos":"verb / noun / adjective / …","en":"English meaning in this context","note":"for verbs: tense and person, e.g. 'passé composé of prendre, je'; otherwise a short usage note (max 12 words)"}`,{modelTier:'quick'});
    const w=normAns(word);ST.dict[w]={lemma:r.lemma,pos:r.pos,en:r.en,note:r.note,fr:r.lemma};
    const keys=Object.keys(ST.dict);if(keys.length>400)delete ST.dict[keys[0]];
    save();
    if(!$('#pop').hidden){showPop(el,body(ST.dict[w]));wire(ST.dict[w]);}
  }catch(e){if(!$('#pop').hidden)showPop(el,`<span class="pw">${esc(word)}</span><div class="note warn" style="margin-top:8px">${esc(aiMsg(e))}</div>`);}
}

/* chat */
function chatRules(sc){return `Tu joues le rôle suivant : ${sc.role}. Tu parles avec un apprenant de français de niveau ${ST.level} qui vit au Luxembourg.
Règles :
- Réponds en 1 à 3 phrases courtes, avec un vocabulaire et une grammaire de niveau ${ST.level}. Sois naturel et chaleureux.
- Termine presque toujours par une question pour faire parler l'apprenant.
- Format obligatoire de CHAQUE réponse :
CORRECTION: OK   (si le dernier message de l'apprenant est correct, ou si c'est le début)
ou
CORRECTION: <sa phrase corrigée> (<explication très courte en anglais>)
---
<ta réplique en français>`;}
function parseChat(txt){
  const parts=txt.split(/\n?\s*-{3,}\s*\n?/);
  if(parts.length<2){return {fix:null,reply:/^CORRECTION/i.test(txt.trim())?'':txt.trim()};}
  const fix=parts[0].replace(/^\s*CORRECTION\s*:\s*/i,'').trim();
  return {fix:/^ok\.?$/i.test(fix)?'OK':fix,reply:parts.slice(1).join('\n').trim()};
}

async function chatSend(msg,box){
  if(msg){CHAT.turns.push({role:'user',content:msg});CHAT.items.push({who:'me',text:msg});}
  else CHAT.turns.push({role:'user',content:'(Commence la conversation maintenant, dans ton rôle.)'});
  const ai={who:'ai',text:''};CHAT.items.push(ai);paintChatLog();
  const send=$('#ch-send');if(send)send.disabled=true;
  const input=[{role:'user',content:chatRules(CHAT.sc)},...CHAT.turns.slice(-16)];
  if(input[1]&&input[1].role==='assistant')input.splice(1,1);
  CHAT.ctl=new AbortController();
  try{
    const r=await AI.text(input,{cache:false,signal:CHAT.ctl.signal,modelTier:'quick',onText:({text})=>{const p=parseChat(text);if(p.reply){ai.text=p.reply;paintChatLog();}}});

    CHAT.turns.push({role:'assistant',content:r.text});
    if(msg){const me=CHAT.items[CHAT.items.length-2];me.fix=p.fix||'OK';
      const ok=me.fix==='OK';record(ok,'chat');

      act('chat');}
    paintChatLog();
    if(ST.chatAuto!==false&&route==='parler') TTS.speak(ai.text);

  if(send)send.disabled=false;
  const inp=$('#ch-in');if(inp)inp.focus();
}

const DAY=86400000;
const SESS={q:[],i:0,flipped:false,done:0};
function schedule(c,g){
  const n=Date.now();c={iv:0,ef:2.5,reps:0,lapses:0,...(c||{})};
  if(g===0){c.reps=0;c.lapses++;c.ef=Math.max(1.3,c.ef-0.2);c.iv=0;c.due=n+60000;return c;}
  if(c.reps===0){c.iv=g===1?0.007:g===2?1:4;}
  else if(c.reps===1&&c.iv<1){c.iv=g===1?1:g===2?2:5;}
  else{c.iv=g===1?Math.max(1,c.iv*1.2):g===2?c.iv*c.ef:c.iv*c.ef*1.35;}
  if(g===1)c.ef=Math.max(1.3,c.ef-0.15);if(g===3)c.ef+=0.15;
  c.reps++;c.due=n+c.iv*DAY;return c;
}

      const have=new Set(allWords().map(w=>normAns(w.fr)));

function paintSession(v){
  const id=SESS.q[SESS.i];const w=allWords().find(x=>x.id===id);
  if(!w){
    v.innerHTML=`<div class="card stack" style="align-items:center;text-align:center;padding:36px"><h2>Session finished</h2><p class="muted">${SESS.done} cards reviewed. À demain !</p><button class="btn primary" data-go="${SESS.back||'mots'}" type="button">Back</button></div>`;
    return;
  }
  const c=ST.srs[id];const isNew=!c;const en=ST.wordDir==='en';
  const labels=[0,1,2,3].map(g=>g===0?'10 min':ivLabel(schedule(c,g).iv));
  const front=en?`<div class="big" style="font-family:var(--f-ui);font-size:1.6rem">${esc(w.en)}</div>`:`<div class="big">${esc(w.fr)}</div>`;
  v.innerHTML=`<div class="stack">
   <div class="row between"><button class="btn ghost sm" data-go="${SESS.back||'mots'}" type="button">← Stop</button><span class="small muted num">${SESS.i+1} / ${SESS.q.length}</span></div>
   <div class="progress"><i style="width:${SESS.i/SESS.q.length*100}%"></i></div>
   <div class="card raised flash">${isNew?'<span class="pill warn">New word</span>':''}${front}
    ${SESS.flipped?`<hr class="sep" style="width:60%">${en?`<div class="big">${esc(w.fr)}</div>`:`<div style="font-size:1.3rem">${w.en?esc(w.en):'<span class="muted small">No translation yet — add one in Mes mots</span>'}</div>`}${w.note?`<div class="small muted">${esc(w.note)}</div>`:''}${w.ex?`<div class="exs">${esc(w.ex)}</div>`:''}<div class="row">${spk(w.fr,'Écouter le mot')}${w.ex?`<button class="btn sm" type="button" data-say="${esc(w.ex)}">▶ Example</button>`:''}</div>`:
    (en?'':`<div class="row">${spk(w.fr)}</div>`)}
   </div>
   ${SESS.flipped?`<div class="rate"><button class="btn" data-g="0" type="button">Again<small>${labels[0]}</small></button><button class="btn" data-g="1" type="button">Hard<small>${labels[1]}</small></button><button class="btn primary" data-g="2" type="button">Good<small style="color:inherit;opacity:.8">${labels[2]}</small></button><button class="btn" data-g="3" type="button">Easy<small>${labels[3]}</small></button></div>`:
   `<button class="btn primary" id="fl" type="button" style="padding:12px">Show answer</button>`}
   <p class="small muted" style="text-align:center">Say the answer out loud before you flip. Keys: space = flip, 1–4 = rate.</p></div>`;
  if(!SESS.flipped&&!en) TTS.speak(w.fr);
  const flip=()=>{SESS.flipped=true;paintSession(v);if(en)TTS.speak(w.fr);};
  const fl=$('#fl');if(fl)fl.onclick=flip;
  const rate=g=>{
    ST.srs[id]=schedule(c,g);
    if(isNew)act('newWords');act('reviews');record(g>0,'mots');
    if(g===0){SESS.q.splice(Math.min(SESS.q.length,SESS.i+4),0,id);}
    SESS.i++;SESS.done++;SESS.flipped=false;paintSession(v);
  };
  $$('[data-g]',v).forEach(b=>b.onclick=()=>rate(+b.dataset.g));
  SESS.key=e=>{if(!params.session||e.target.matches('input,textarea,select'))return;if(e.key===' '&&!SESS.flipped){e.preventDefault();flip();}else if(SESS.flipped&&/^[1-4]$/.test(e.key))rate(+e.key-1);};
}
document.addEventListener('keydown',e=>{if(SESS.key)SESS.key(e);});

    <span class="mast"><span class="small muted num">${m?m+'%':'—'}</span><div class="progress" style="margin-top:4px"><i style="width:${m}%;${m>=80?'background:var(--ok)':''}"></i></div></span></button>`;}).join('')}</div></div>`;
  const run=()=>{const verb=normAns($('#cj-v').value);if(!verb)return;const out=$('#cj-out');

- {"type":"fill","q":"sentence with ___ for the gap and the hint in brackets, e.g. Hier, je ___ (aller) au marché.","answer":"exact words for the gap","alt":["other acceptable answers"],"why":"short English explanation"}

function paintDrill(v){
  const u=UNITS.find(x=>x.id===DRILL.unit);const it=DRILL.items[DRILL.i];
  if(!it){
    const pct=Math.round(DRILL.score/DRILL.items.length*100);
    const us=ST.unitScores[u.id]||{best:0,n:0};us.best=Math.max(us.best||0,pct);us.last=pct;us.n=(us.n||0)+1;ST.unitScores[u.id]=us;save();
    v.innerHTML=`<div class="card stack" style="align-items:center;text-align:center;padding:34px"><div class="eyebrow">${esc(u.title)}</div><h1 class="num">${pct}%</h1><p class="muted">${DRILL.score} / ${DRILL.items.length} correct. ${pct>=80?'Step mastered. On to the next one!':'Do another round. Aim for 80%.'}</p>
      ${DRILL.wrong.length?`<div class="list" style="width:100%;text-align:left">${DRILL.wrong.map(w=>`<div class="li"><div class="grow"><div class="small muted">${esc(w.q)}</div><div class="fr">${esc(w.a)}</div></div></div>`).join('')}</div>`:''}
      <div class="row"><button class="btn primary" data-go="grammaire" data-arg='${esc(JSON.stringify({unit:u.id}))}' type="button">Back to the rule</button><button class="btn" data-go="grammaire" type="button">The ladder</button></div></div>`;
    DRILL=null;return;
  }
  let body='';
  if(it.type==='conj') body=`<div class="eyebrow">${esc(TENSES[it.tense])} · ${esc(it.verb)}</div><div class="prompt-big">${esc(it.label)}${it.label.endsWith("'")?'':' '}<span class="blank">&nbsp;</span> <span class="muted" style="font-size:.9rem">(${esc(it.verb)})</span></div>
    <input type="text" id="dr-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${it.tense==='pc'||it.tense==='pqp'?'auxiliary + participle':'verb form'}">`;
  else if(it.type==='fill') body=`<div class="prompt-big">${esc(it.q)}</div><input type="text" id="dr-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Missing word(s)">`;
  else body=`<div class="prompt-big">${esc(it.q)}</div><div class="choices">${it.options.map((o,j)=>`<button class="choice" type="button" data-o="${j}">${esc(o)}</button>`).join('')}</div>`;
  v.innerHTML=`<div class="stack"><div class="row between"><button class="btn ghost sm" data-go="grammaire" data-arg='${esc(JSON.stringify({unit:u.id}))}' type="button">← Stop</button><span class="small muted num">${DRILL.i+1} / ${DRILL.items.length} · ${DRILL.score} ✓</span></div>
   <div class="progress"><i style="width:${DRILL.i/DRILL.items.length*100}%"></i></div>
   <div class="card raised drill">${body}<div id="dr-fb"></div>${it.type!=='mc'?`<div class="row"><button class="btn primary" id="dr-ok" type="button">Check</button></div>`:''}</div></div>`;
  const fb=$('#dr-fb');
  const next=()=>{DRILL.i++;DRILL.answered=false;paintDrill(v);};
  const finish=(ok,shown,why,qtext,user)=>{
    DRILL.answered=true;if(ok)DRILL.score++;else DRILL.wrong.push({q:qtext,a:shown});
    record(ok,'grammaire');act('drills');
    if(!ok&&user) addMistake({src:'grammaire',wrong:user,right:shown,why:(why?why+' ':'')+'('+qtext+')'});
    fb.innerHTML+=`<div class="row" style="margin-top:10px"><button class="btn primary" id="dr-next" type="button">Next →</button></div>`;
    const nb=$('#dr-next');nb.onclick=next;nb.focus();
    const okb=$('#dr-ok');if(okb)okb.remove();
  };
  if(it.type==='mc'){
    $$('.choice',v).forEach(b=>b.onclick=()=>{if(DRILL.answered)return;const ok=+b.dataset.o===it.a;$$('.choice',v).forEach(x=>{x.disabled=true;if(+x.dataset.o===it.a)x.classList.add('right');});if(!ok)b.classList.add('wrong');
      fb.innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'Correct ! ':''}${esc(it.why||'')}</div>`;
      finish(ok,it.options[it.a],it.why,it.q,ok?null:it.options[+b.dataset.o]);});
  }else{
    const inp=$('#dr-in');inp.focus();
    const check=()=>{if(DRILL.answered){next();return;}const val=inp.value;if(!val.trim())return;
      let user=val.replace(/^\s*(que\s+|qu')?(je\s+|j'|tu\s+|il\s+|elle\s+|on\s+|nous\s+|vous\s+|ils\s+|elles\s+)/i,'');
      const answers=it.answers;const res=compareAns(user,answers);const shown=it.type==='conj'?`${it.label}${it.label.endsWith("'")?'':' '}${answers.join(' / ')}`:answers[0];
      const ok=res==='good'||res==='accent';
      fb.innerHTML=`<div class="feedback ${ok?(res==='accent'?'close':'good'):'bad'}">${ok?(res==='accent'?'Correct, but watch the accents: ':'Correct ! '):'Answer: '}<span class="ans">${esc(shown)}</span> ${spk(it.type==='conj'?shown.split(' / ')[0]:shown)}${it.why?`<div class="small" style="margin-top:4px">${esc(it.why)}</div>`:''}</div>`;
      inp.disabled=true;finish(ok,shown,it.why||'',it.type==='conj'?`${it.verb}, ${TENSES[it.tense]}, ${it.person}`:it.q,ok?null:val);
    };
    $('#dr-ok').onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  }
}

   <input type="text" id="mr-in" autocomplete="off" spellcheck="false" placeholder="Write the correct version"><div id="mr-fb"></div><div class="row"><button class="btn primary" id="mr-ok" type="button">Check</button></div></div></div>`;
